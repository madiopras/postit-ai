# ~/.codex/config.toml

# Reasoning tinggi membantu debugging, planning, dan perubahan multi-file.
model_reasoning_effort = "high"

# Codex dapat menulis ke workspace, tetapi tetap dibatasi sandbox.
sandbox_mode = "workspace-write"

# Codex meminta izin untuk tindakan yang membutuhkan akses tambahan.
approval_policy = "on-request"